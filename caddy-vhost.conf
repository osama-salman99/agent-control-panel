# Appended to /etc/caddy/Caddyfile. TLS comes from the Cloudflare origin
# certificate (the shared tls_origin snippet), not ACME, so this block is valid
# before the DNS record for it exists — it simply starts serving once
# session.osmosis.work is a CNAME to osmosis.work.
session.osmosis.work {
	import tls_origin
	import security_headers

	log {
		output file /var/log/caddy/session-access.log
		format json
	}

	# session-controller. The one and only way in: its predecessor
	# (remote-control-server, port 8220, coder.osmosis.work/session) was deleted
	# on 2026-08-09 — unit, drop-ins, /opt directory and route all gone.
	reverse_proxy 127.0.0.1:8221
}
